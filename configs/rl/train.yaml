defaults:
  - _self_

seed: 42
device: auto

cv:
  weights: checkpoints/cv/resnet18_pose/state_regressor_resnet18.pth
  model_type: resnet18
  metadata: data/cv_integrations/x_y_theta/metadata.json

env:
  obs_mode: hybrid

rl:
  algorithm: dqn
  timesteps: 100000
  policy: MlpPolicy
  gamma: 0.99
  dqn:
    learning_rate: 0.0001
    buffer_size: 1000000
    learning_starts: 100
    batch_size: 32
    train_freq: 4
    gradient_steps: 1
    target_update_interval: 10000
    exploration_fraction: 0.1
    exploration_final_eps: 0.05
  ppo:
    learning_rate: 0.0003
    n_steps: 1024
    batch_size: 64
    n_epochs: 10
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0
    vf_coef: 0.5

output:
  save_path: checkpoints/rl/sb3_dqn/models/dqn_vision_lander.zip

load:
  path: null
  resume: false
  reset_num_timesteps: false

visualization:
  enabled: false
  dir: runs/visualizations
  freq: 10000
  max_steps: 0
  fps: 30
  overlay_cv_pose: false

checkpoint:
  dir: checkpoints/rl/sb3_dqn/periodic
  freq: 50000

replay_buffer:
  save: true
  path: null

hydra:
  job:
    chdir: false
  run:
    dir: runs/hydra/rl/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: runs/hydra/rl_multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
